# XcodeGen spec. Regenerate the Xcode project with:  xcodegen generate
name: Wilderness
options:
  bundleIdPrefix: com.mattmccoy
  deploymentTarget:
    tvOS: "17.0"
settings:
  base:
    # Matt's free Personal Team (also in the tvOS profiles); lets Xcode sign every target.
    DEVELOPMENT_TEAM: 8HZXZFRWC6
    CODE_SIGN_STYLE: Automatic
packages:
  WildernessCore:
    path: Packages/WildernessCore
targets:
  Wilderness:
    type: application
    platform: tvOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        NSBonjourServices: [_wilderness._tcp]
        NSLocalNetworkUsageDescription: The Wilderness talks to your iPhone on your home network so you can guide the wall from your phone.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    dependencies:
      - package: WildernessCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattmccoy.wilderness
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: The Wilderness
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "3"
        ASSETCATALOG_COMPILER_APPICON_NAME: "App Icon & Top Shelf Image"
  WildernessUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources: [UITests]
    dependencies:
      - target: Wilderness
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mattmccoy.wilderness.uitests
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "3"
  WildernessPhone:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - Phone
      - path: App/Content/painting.jpg
        buildPhase: resources
      - path: App/Content/annotations.json
        buildPhase: resources
      - path: App/Fonts
        buildPhase: resources
    info:
      path: Phone/Info.plist
      properties:
        CFBundleDisplayName: Wilderness
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSBonjourServices: [_wilderness._tcp]
        NSLocalNetworkUsageDescription: Wilderness finds The Wilderness on your Apple TV so you can guide the wall from your phone.
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    dependencies:
      - package: WildernessCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mattmccoy.wilderness.phone
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  WildernessPhoneUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources: [PhoneUITests]
    dependencies:
      - target: WildernessPhone
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mattmccoy.wilderness.phone.uitests
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  Wilderness:
    build:
      targets:
        Wilderness: all
    test:
      targets:
        - WildernessUITests
  WildernessPhone:
    build:
      targets:
        WildernessPhone: all
    test:
      targets:
        - WildernessPhoneUITests
